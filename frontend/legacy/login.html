<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta Gestão OS">
    <title>Login - Gestão OS</title>
    <script src="js/i18n.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
<link rel="icon" type="image/png" href="assets/logo.png"></head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">

            <!-- ============================================
                 BRAND
                 ============================================ -->
            <a href="index.html" class="auth-brand" style="text-decoration:none;">
                <img src="assets/logo.png" alt="Gestão OS" style="height: 40px; width: auto;">
                <h1>Gestão OS</h1>
            </a>

            <!-- ============================================
                 HEADER
                 ============================================ -->
            <div class="auth-header">
                <h2>Bem-vindo de volta</h2>
                <p>Entre com suas credenciais para acessar o sistema</p>
            </div>

            <!-- ============================================
                 FORMULÁRIO
                 ============================================ -->
            <form id="login-form" autocomplete="on" novalidate>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        required 
                        placeholder="seu@email.com" 
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div style="position:relative;">
                        <input 
                            type="password" 
                            id="senha" 
                            name="senha"
                            required 
                            placeholder="••••••••" 
                            autocomplete="current-password"
                            style="padding-right:44px;"
                        >
                        <button 
                            type="button" 
                            id="toggle-senha"
                            aria-label="Mostrar senha"
                            style="
                                position:absolute;
                                right:8px;
                                top:50%;
                                transform:translateY(-50%);
                                background:none;
                                border:none;
                                cursor:pointer;
                                font-size:1.1rem;
                                padding:8px;
                                color:var(--text-muted);
                                border-radius:6px;
                                transition:all 0.2s;
                            "
                        >[[icone:visualizar]]</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> 
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="alert('Funcionalidade em desenvolvimento'); return false;">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
                    Entrar
                </button>

            </form>

            <!-- ============================================
                 MENSAGENS
                 ============================================ -->
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <!-- ============================================
                 RODAPÉ
                 ============================================ -->
            <div class="auth-footer">
                <p>
                    Não tem uma empresa? 
                    <a href="criar-empresa.html">Criar Empresa</a>
                </p>
                <p>
                    É funcionário? 
                    <a href="entrar-empresa.html">Entrar em uma Empresa</a>
                </p>
            </div>

        </div>
    </div>

    <!-- ============================================
         SCRIPTS
         ============================================ -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ==========================================
        // ELEMENTOS
        // ==========================================
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btn-login');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        const toggleSenha = document.getElementById('toggle-senha');
        const rememberCheckbox = document.getElementById('remember');

        // ==========================================
        // MOSTRAR/OCULTAR SENHA
        // ==========================================
        toggleSenha.addEventListener('click', () => {
            const isPassword = senhaInput.type === 'password';
            senhaInput.type = isPassword ? 'text' : 'password';
            toggleSenha.textContent = isPassword ? '[[icone:ocultar]]' : '[[icone:visualizar]]';
            toggleSenha.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
        });

        // ==========================================
        // MENSAGENS
        // ==========================================
        function mostrarErro(msg) {
            successDiv.classList.remove('show');
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
        }

        function mostrarSucesso(msg) {
            errorDiv.classList.remove('show');
            successDiv.textContent = msg;
            successDiv.classList.add('show');
        }

        function limparMensagens() {
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
        }

        // ==========================================
        // CARREGAR E-MAIL SALVO (LEMBRAR-ME)
        // ==========================================
        const savedEmail = localStorage.getItem('remember_email');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberCheckbox.checked = true;
            senhaInput.focus();
        }

        // ==========================================
        // VALIDAÇÃO EM TEMPO REAL
        // ==========================================
        emailInput.addEventListener('blur', () => {
            if (emailInput.value && !validarEmail(emailInput.value)) {
                emailInput.style.borderColor = 'var(--danger)';
            } else {
                emailInput.style.borderColor = '';
            }
        });

        emailInput.addEventListener('input', () => {
            emailInput.style.borderColor = '';
        });

        // ==========================================
        // SUBMIT DO FORMULÁRIO
        // ==========================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            limparMensagens();

            const email = emailInput.value.trim();
            const senha = senhaInput.value;

            // Validações
            if (!email) {
                mostrarErro('Por favor, informe seu e-mail');
                emailInput.focus();
                return;
            }

            if (!validarEmail(email)) {
                mostrarErro('Por favor, informe um e-mail válido');
                emailInput.focus();
                return;
            }

            if (!senha) {
                mostrarErro('Por favor, informe sua senha');
                senhaInput.focus();
                return;
            }

            if (senha.length < 8) {
                mostrarErro('A senha deve ter no mínimo 8 caracteres');
                senhaInput.focus();
                return;
            }

            // Estado de loading
            btnLogin.disabled = true;
            btnLogin.textContent = '[[icone:relogio]] Entrando...';

            try {
                const data = await apiRequest('/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, senha })
                });

                // Salvar e-mail se "Lembrar-me" estiver marcado
                if (rememberCheckbox.checked) {
                    localStorage.setItem('remember_email', email);
                } else {
                    localStorage.removeItem('remember_email');
                }

                // Salvar dados de sessão
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                localStorage.setItem('empresa', JSON.stringify(data.empresa));

                // Mostrar sucesso
                mostrarSucesso('[[icone:confirmar]] Login realizado! Redirecionando...');

                // Redirecionar conforme role
                setTimeout(() => {
                    const role = data.usuario.role;
                    const dashboards = {
                        'administrador_principal': 'admin/dashboard.html',
                        'administrador_setor': 'admin/dashboard.html',
                        'gestor': 'gestor/dashboard.html',
                        'colaborador': 'colaborador/dashboard.html'
                    };

                    window.location.href = dashboards[role] || 'index.html';
                }, 600);

            } catch (error) {
                console.error('Erro no login:', error);
                
                // Mensagens de erro amigáveis
                let mensagem = error.message;

                if (mensagem.includes('Credenciais inválidas')) {
                    mensagem = '[[icone:fechar]] E-mail ou senha incorretos. Tente novamente.';
                } else if (mensagem.includes('Empresa inativa')) {
                    mensagem = '[[icone:alerta]] A empresa está inativa. Entre em contato com o administrador.';
                } else if (mensagem.includes('conexão')) {
                    mensagem = '[[icone:caixa]] Erro de conexão. Verifique se o servidor está rodando.';
                }

                mostrarErro(mensagem);

                // Reabilitar botão
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';

                // Focar no campo com erro
                if (mensagem.includes('senha')) {
                    senhaInput.focus();
                    senhaInput.select();
                }
            }
        });

        // ==========================================
        // ENTER KEY
        // ==========================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !btnLogin.disabled) {
                if (document.activeElement === emailInput || document.activeElement === senhaInput) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ==========================================
        // VERIFICAR SE JÁ ESTÁ LOGADO
        // ==========================================
        if (estaLogado()) {
            // Se já está logado, redirecionar
            const user = getUsuario();
            if (user) {
                const dashboards = {
                    'administrador_principal': 'admin/dashboard.html',
                    'administrador_setor': 'admin/dashboard.html',
                    'gestor': 'gestor/dashboard.html',
                    'colaborador': 'colaborador/dashboard.html'
                };

                if (dashboards[user.role]) {
                    mostrarSucesso('Você já está logado! Redirecionando...');
                    setTimeout(() => {
                        window.location.href = dashboards[user.role];
                    }, 800);
                }
            }
        }
    </script>

<script src="js/icones.js"></script>
</body>
</html>
